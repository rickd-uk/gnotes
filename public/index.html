<!doctype html>
<html>
  <head>
    <title>gnotes</title>
    <style>
      body {
        font-family: sans-serif;
        background: #1a1a1a;
        color: #eee;
        padding: 40px;
        max-width: 800px;
        margin: auto;
      }

      /* Form Styling */
      .form-container {
        background: #222;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
        border: 1px solid #444;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        background: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button.save-btn {
        background: #a6e3a1;
        color: #111;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }

      /* Note Card Styling */
      .note-card {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        border-left: 4px solid #a6e3a1;
        position: relative;
      }
      .delete-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: #f38ba8;
        color: #111;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .date {
        color: #888;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>gnotes</h1>

    <div class="form-container">
      <h3>New Note</h3>
      <input type="text" id="title" placeholder="Title" />
      <textarea
        id="content"
        rows="4"
        placeholder="Content (Markdown supported...)"
      ></textarea>
      <button class="save-btn" onclick="saveNote()">Save Note</button>
    </div>

    <hr style="border: 0.5px solid #444; margin: 20px 0" />

    <div id="notes-list">Loading notes...</div>

    <script>
      // Fetch and display all notes
      async function loadNotes() {
        const response = await fetch("/api/notes/list");
        const notes = await response.json();
        const list = document.getElementById("notes-list");

        list.innerHTML = notes
          .map(
            (n) => `
                <div class="note-card">
                    <button class="delete-btn" onclick="deleteNote(${n.id})">Delete</button>
                    <div class="date">${new Date(n.created_at).toLocaleString()}</div>
                    <h3>${n.title}</h3>
                    <div>${n.html_content}</div>
                </div>
            `,
          )
          .join("");
      }

      // Send a new note to the Go backend
      async function saveNote() {
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;

        if (!title || !content) return alert("Please fill in both fields");

        await fetch("/api/notes/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, content }),
        });

        // Clear inputs and reload
        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
        loadNotes();
      }

      // Delete a note via ID
      async function deleteNote(id) {
        if (!confirm("Delete this note?")) return;

        await fetch(`/api/notes/delete?id=${id}`, {
          method: "POST", // Your Go handler accepts POST or DELETE
        });

        loadNotes();
      }

      // Initial load
      loadNotes();
    </script>
  </body>
</html>

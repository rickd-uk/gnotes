# Install in /etc/nginx/conf.d so these directives load inside nginx's http block.
limit_req_zone $binary_remote_addr zone=gnotes_login_ip:10m rate=5r/m;
limit_req_zone $server_name zone=gnotes_login_global:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=gnotes_signup_ip:10m rate=1r/m;
limit_req_zone $server_name zone=gnotes_signup_global:10m rate=30r/m;

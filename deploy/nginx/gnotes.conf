server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notes.example.com;

    ssl_certificate /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 3m;
    limit_req_status 429;

    location = /api/auth/login {
        limit_req zone=gnotes_login_ip burst=5 nodelay;
        limit_req zone=gnotes_login_global burst=20 nodelay;
        include /etc/nginx/snippets/gnotes-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=gnotes_signup_ip burst=2 nodelay;
        limit_req zone=gnotes_signup_global burst=10 nodelay;
        include /etc/nginx/snippets/gnotes-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/gnotes-proxy.conf;
    }
}

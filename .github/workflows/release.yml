name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_CFLAGS: -O2 -g -ftls-model=initial-exec
      GOFLAGS: -tags=sqlite_fts5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Install backup test dependency
        run: sudo apt-get update && sudo apt-get install -y restic libssl-dev

      - name: Test
        run: |
          go test ./...
          go test -race ./cmd/server
          go test -race ./internal/storage
          go vet ./...
          python3 -m unittest discover -s deploy/tests -p "backup_control_test.py"
          python3 -m unittest discover -s deploy/tests -p "volatile_key_test.py"
          shellcheck -s sh deploy/scripts/backup-gnotes deploy/scripts/backup-gnotes-podman deploy/scripts/replicate-gnotes-wasabi deploy/scripts/check-gnotes deploy/scripts/restore-gnotes deploy/scripts/restore-gnotes-podman deploy/scripts/update-gnotes deploy/scripts/update-gnotes-podman deploy/tests/*.sh
          deploy/tests/backup-gnotes-podman-test.sh
          deploy/tests/replicate-gnotes-wasabi-test.sh
          deploy/tests/update-gnotes-test.sh
          deploy/tests/restore-gnotes-test.sh
          deploy/tests/restore-gnotes-podman-test.sh
          deploy/tests/restore-gnotes-rehearsal.sh
          deploy/tests/encryption-rehearsal.sh

      - name: Build and package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          package_dir="dist/package"
          asset="gnotes_${RELEASE_VERSION}_linux_amd64.tar.gz"

          install -d "$package_dir/bin" "$package_dir/public" "$package_dir/systemd"
          install -m 0644 deploy/systemd/gnotes-backup-control.service deploy/systemd/gnotes-wasabi-backup.service deploy/systemd/gnotes-wasabi-backup.timer deploy/systemd/gnotes-podman-backup.service deploy/systemd/gnotes-podman-backup.timer "$package_dir/systemd/"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "$package_dir/gnotes" ./cmd/server
          cp -a public/. "$package_dir/public/"
          install -m 0755 deploy/scripts/update-gnotes "$package_dir/bin/update-gnotes"
          install -m 0755 deploy/scripts/check-gnotes "$package_dir/bin/check-gnotes"
          install -m 0755 deploy/scripts/restore-gnotes "$package_dir/bin/restore-gnotes"
          install -m 0755 deploy/scripts/restore-gnotes-podman "$package_dir/bin/restore-gnotes-podman"
          install -m 0755 deploy/scripts/backup-gnotes-podman "$package_dir/bin/backup-gnotes-podman"
          install -m 0755 deploy/scripts/replicate-gnotes-wasabi "$package_dir/bin/replicate-gnotes-wasabi"
          install -m 0755 deploy/scripts/gnotes-backup-control "$package_dir/bin/gnotes-backup-control"
          install -m 0755 deploy/scripts/update-gnotes-podman "$package_dir/bin/update-gnotes-podman"
          install -m 0755 deploy/scripts/prepare-gnotes-volatile-host deploy/scripts/unlock-gnotes-podman "$package_dir/bin/"
          printf '%s\n' "$RELEASE_VERSION" > "$package_dir/VERSION"
          cp LICENSE "$package_dir/LICENSE"
          cp THIRD_PARTY_NOTICES.txt ENCRYPTION.md "$package_dir/"

          tar -C "$package_dir" -czf "dist/$asset" .
          (cd dist && sha256sum "$asset" > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$RELEASE_VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$RELEASE_VERSION" $prerelease \
            "dist/gnotes_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "gnotes $RELEASE_VERSION" \
            --generate-notes
